<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phrase Lab</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>PHRASE LAB</b><small>listen · analyze · practice</small></div><button id="newBtn">＋ 新しいフレーズ</button></header><main><section class="hero"><p class="eyebrow">YOUR MUSICAL VOCABULARY</p><h1>フレーズを、<br><em>自分の言葉</em>にする。</h1><p>好きなフレーズを保存して、聴いて、分解して、移調して、練習するための研究室。</p></section><section class="toolbar"><input id="search" placeholder="曲名・タグ・コードで検索"><select id="filter"><option value="">すべて</option><option>未分析</option><option>分析中</option><option>練習中</option><option>習得</option></select></section><section id="cards" class="grid"></section></main><dialog id="editor"><form method="dialog" id="form"><div class="modalHead"><h2>Phrase Study</h2><button value="cancel">×</button></div><label>タイトル<input id="title" required placeholder="例：サビ前ギターフレーズ"></label><div class="row"><label>キー<select id="key"></select></label><label>BPM<input id="bpm" type="number" min="20" max="300" value="120"></label><label>状態<select id="status"><option>未分析</option><option>分析中</option><option>練習中</option><option>習得</option></select></label></div><label>コード進行<input id="chords" placeholder="Am7 | D7 | Gmaj7"></label><label>音・フレーズ<input id="notes" placeholder="A C D E G E"></label><label>タグ<input id="tags" placeholder="ギター, neo soul, ending"></label><label>研究メモ<textarea id="memo" rows="5" placeholder="コードトーンへの着地、好きな動きなど"></textarea></label><label>音源<input id="audio" type="file" accept="audio/*"></label><div id="playerBox" hidden><audio id="player" controls></audio><div class="speed">速度 <input id="speed" type="range" min=".5" max="1.5" step=".05" value="1"><span id="speedText">100%</span></div></div><button class="save" value="default">保存する</button></form></dialog><script src="app.js"></script></body></html>
